name: daily-news-crawl

on:
  schedule:
    # 22:30 UTC = 한국시간 07:30 (GitHub 예약 실행은 수 분~수십 분 밀릴 수 있음)
    - cron: '30 22 * * *'
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: Chromium 설치
        run: npx playwright install --with-deps chromium

      - name: 뉴스 수집
        run: npm run crawl

      - name: 실패 시 디버그 파일 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 결과 커밋
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: 뉴스 수집 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M KST')"
          git push
